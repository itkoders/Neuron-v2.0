name: Build NEURON Android APK

on:
  workflow_dispatch:
    inputs:
      neuron_base_url:
        description: "NEURON Render server URL (https://...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android-apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate server URL
        shell: bash
        run: |
          case "${{ inputs.neuron_base_url }}" in
            https://*) ;;
            *) echo "Server URL must start with https://" >&2; exit 1 ;;
          esac

      - name: Build debug APK
        run: gradle -p android assembleDebug -PNEURON_BASE_URL="${{ inputs.neuron_base_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEURON-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
